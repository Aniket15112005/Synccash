<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SyncCash — Shared real-time cashbook for two.">
  <meta name="theme-color" content="#0A0E17">

  <!-- PWA: iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SyncCash">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- PWA: splash colors while loading on iOS -->
  <meta name="msapplication-TileColor" content="#0A0E17">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SyncCash</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevents white flash while Flutter loads */
    html, body {
      background-color: #0A0E17;
      margin: 0;
      padding: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    // Register Firebase Messaging service worker for web/iOS PWA notifications
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker
        .register('firebase-messaging-sw.js')
        .then(function(reg) {
          console.log('FCM SW registered:', reg.scope);
        })
        .catch(function(err) {
          console.warn('FCM SW registration failed:', err);
        });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
