name: synccash
description: A premium shared real-time cashbook for exactly two users.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  http_parser: ^4.0.2
  record: ^7.1.1
  speech_to_text: ^7.0.0

  # State Management & Routing
  flutter_riverpod: ^3.3.1
  go_router: ^14.0.1

  # Firebase Ecosystem
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^18.0.1

  # UI & Animation
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  riverpod_annotation: ^4.0.2

  # Export / Import / Backup
  pdf: ^3.11.0
  excel: ^4.0.3
  share_plus: ^12.0.2
  path_provider: ^2.1.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
